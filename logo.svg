<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Boltrix LLC</title>
<desc id="desc">Boltrix LLC corporate logo with a clean stylized B and teal directional mark.</desc>
<defs>
  <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#00a8a5"/>
    <stop offset="1" stop-color="#19d8d0"/>
  </linearGradient>
</defs>
<!-- Transparent canvas: designed to sit cleanly over the warehouse hero -->
<g transform="translate(55 42)">
  <!-- clean, strong B -->
  <text x="0" y="215" font-family="Arial,Helvetica,sans-serif" font-size="218" font-weight="900" fill="#ffffff">B</text>
  <!-- separate directional mark; positioned so it does not visually distort the B -->
  <path d="M42 205 L174 116 L214 139 L82 228 Z" fill="url(#teal)"/>
  <path d="M174 91 L244 100 L207 151 Z" fill="url(#teal)"/>
</g>
<!-- Wordmark -->
<text x="335" y="205" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900" letter-spacing="7" fill="#ffffff">BOLTRIX</text>
<rect x="335" y="235" width="330" height="5" rx="2.5" fill="url(#teal)"/>
<text x="500" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="13" fill="#19d8d0">LLC</text>
</svg>