<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Boltrix LLC</title>
<desc id="desc">Boltrix LLC logo with a refined stylized B and upward arrow.</desc>
<defs>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#25e3dc"/>
    <stop offset="1" stop-color="#00aaa7"/>
  </linearGradient>
</defs>
<!-- Refined transparent logo: designed to sit cleanly over the warehouse hero -->
<g transform="translate(45 28)">
  <text x="0" y="190" font-family="Arial,Helvetica,sans-serif" font-size="190" font-weight="900" fill="#ffffff">B</text>
  <path d="M24 176 L170 78 L216 105 L70 203 Z" fill="url(#teal)"/>
  <path d="M188 62 L246 70 L215 123 Z" fill="url(#teal)"/>
</g>
<text x="325" y="174" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900" letter-spacing="8" fill="#ffffff">BOLTRIX</text>
<rect x="328" y="202" width="315" height="4" rx="2" fill="url(#teal)"/>
<text x="485" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" letter-spacing="14" fill="#25e3dc">LLC</text>
</svg>